<!DOCTYPE html>
<!--Le dice al navegador que es un documento HTML5.-->


<html lang="en">
<!--Empieza el documento HTML. lang="en" indica idioma inglés (si es en español podrías poner es).-->


<head>

    <!-- Contiene información de la página (no se ve directamente). -->


    
    <meta charset="UTF-8">


<!-- Permite caracteres como ñ, tildes, etc. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-Hace que se adapte bien en celulares.-  -->
    
    
    
    <title>Hola mundo</title>

<!-- Es el título que aparece en la pestaña del navegador. -->


</head>

<body>

    
<!-- Aquí va el contenido visible (texto, imágenes, botones, etc.). -->


</body>







</html>
