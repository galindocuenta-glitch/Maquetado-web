<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <h3>

<body>
    <!-- La etiqueta table se utiliza para definir tablas en HTML. Todo el contenido de la tabla, incluidas las filas y celdas, se coloca dentro de esta etiqueta-->

    <!-- La etiqueta tr se utiliza para definir una fila en una tabla. Cada fila puede contener una o mas celdas, que se definen utilizando las etiquetas td (para celdas de datos) o th (para celdas de encabezadps)-->

     <!-- La etiqueta td define una celda de datos dentro de una fila.Cada etiqueta td representa una columna en la tabla-->

     <!-- La etiqueta th define una celda de encabezado dentro de una fila. Cada etiqueta th representa un encabezado de la columna de la tabla-->

     <table border="3">  <!-- Etique de apertura -->
<tr>   
    <th>Encabezado 1</th>
    <th>Encabezado 2</th>
    <th>Encabezado 3</th>
</tr>
<tr>
    <td> Dato 1</td>
    <td> Dato 2</td>
    <td> Dato 3</td>
</tr>

<tr>
    <td>dato 4</td>
    <td>dato5</td>
    <td>dato6</td>
</tr>


     </table>  <!-- Etique de cerrado -->


     <table border="1">

<caption> Paises y Capitales</caption>
<tr>

<th>pais </th>
<th>capital</th>


</tr>

<tr>
    <td>España</td>
    <td>Madrid</td>
</tr>



<tr>

    <td>Francia</td>
    <td>Paris</td>
</tr>


<tr>
    <td>Italia</td>
    <td>Roma</td>
</tr>
     </table>


<table border="2">

</table>


</body>
